name: Verify and release SignalBar

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: npm run package

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Verify archive and create checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          unzip -t "out/SignalBar-v${VERSION}.zip"
          cd out
          sha256sum "SignalBar-v${VERSION}.zip" > SHA256SUMS

      - name: Preserve release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: signalbar-release
          path: |
            out/SignalBar-*.zip
            out/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: signalbar-release
          path: release-assets

      - name: Create release and upload ZIP
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-assets/SignalBar-${GITHUB_REF_NAME}.zip" \
            "release-assets/SHA256SUMS" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "SignalBar ${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
